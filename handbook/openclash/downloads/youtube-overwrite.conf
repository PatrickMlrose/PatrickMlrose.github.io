# OpenClash 近期版本的覆写模块，不是完整 Mihomo 配置。
# 使用前确认策略组叫 Proxy；否则修改最后一行。
# +rules 会插到原有规则前，可能覆盖原有设备直连等优先规则。
# GitHub 规则需可下载。匹配配置、启用、保存并重启后检查运行配置。
[YAML]
rule-providers:
  guide-youtube:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
    path: ./rule_provider/guide-youtube.mrs
    interval: 86400
+rules:
  - RULE-SET,guide-youtube,Proxy
