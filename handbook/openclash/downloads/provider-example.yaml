# 教学示例，阅读《OpenClash使用指南》第 11 节后再使用。
# 必须替换订阅 URL；需要近期 Mihomo，端口/透明接管由 OpenClash 管理。
# 未针对你的路由器做上网测试。不要公开含真实 token 的配置。
mode: rule
log-level: info
ipv6: false

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  provider-main:
    type: http
    url: "https://example.com/replace-with-your-mihomo-subscription"
    path: ./proxy_provider/guide-main.yaml
    interval: 86400
    # 启动阶段订阅需可独立获取；不要依赖尚未下载到的节点。
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600

proxy-groups:
  - name: Auto
    type: url-test
    use: [provider-main]
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
  - name: Proxy
    type: select
    proxies: [Auto]
    use: [provider-main]

rule-providers:
  cn-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./rule_provider/guide-cn-domain.mrs
    interval: 86400
    proxy: DIRECT
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    path: ./rule_provider/guide-cn-ip.mrs
    interval: 86400
    proxy: DIRECT

dns:
  enable: true
  # OpenClash 可能覆写端口；应与插件 DNS 接管端口一致。
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
    - '+.home.arpa'
  # 过滤不会自动解析你的本地域名。需要时另设本地 DNS 分流，避免回环。
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    'rule-set:cn-domain':
      - https://dns.alidns.com/dns-query
  nameserver:
    - 'https://1.1.1.1/dns-query#Proxy'

rules:
  # 局域网/私网目标直连；根据你的实际网络补充其他网段和域名。
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - RULE-SET,cn-domain,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  - MATCH,Proxy
